<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>视界滞后 - Sight Lag</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    background-color: #020403; color: #00FF66;
    font-family: ui-monospace, "SF Mono", Monaco, Menlo, Consolas, "Cascadia Code", "Roboto Mono", "PingFang SC", "Microsoft YaHei", "Source Han Sans CN", monospace;
    overflow: hidden; user-select: none;
}
#game-container { position: relative; width: 100vw; height: 100vh; background: #030705; overflow: hidden; }
canvas { display: block; cursor: crosshair; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

.hud-overlay {
    position: absolute; top: 15px; left: 20px; right: 20px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; font-weight: bold; font-size: 11px;
    letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(0,255,102,0.6);
    z-index: 10;
}
.status-box {
    background: rgba(4, 16, 10, 0.90); border: 1px solid #00FF66;
    padding: 10px 16px; border-radius: 4px;
    box-shadow: 0 0 15px rgba(0,255,102,0.2); min-width: 250px;
}
.status-box.right-status {
    min-width: 150px;
    padding: 8px 14px;
    margin-top: 48px;
    margin-right: 0px;
}
.bar-outer {
    width: 100%; height: 10px; background: rgba(0, 30, 15, 0.9);
    border: 1px solid #00FF66; margin-top: 3px; position: relative;
    box-shadow: inset 0 0 5px #000;
}
.bar-inner { height: 100%; width: 100%; background: #00FF66; transition: width 0.05s linear; }
.bar-inner.blind { background: #FFCC00; }
.bar-inner.shield { background: #00CCFF; }

#alarm-banner {
    display: none; position: absolute; top: 85px; left: 50%; transform: translateX(-50%);
    color: #FF3344; font-size: 14px; font-weight: bold; letter-spacing: 2px;
    text-shadow: 0 0 10px #FF3344; animation: blink 0.8s infinite alternate;
    z-index: 10; pointer-events: none;
    background: rgba(20, 4, 6, 0.85); padding: 6px 16px; border: 1px solid #FF3344; border-radius: 4px;
    white-space: nowrap; max-width: 95vw; box-sizing: border-box; text-align: center;
}
@keyframes blink { from { opacity: 1; } to { opacity: 0.3; } }

#game-over-screen {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(2, 6, 4, 0.94); z-index: 100; flex-direction: column;
    justify-content: center; align-items: center; text-shadow: 0 0 10px #00FF66;
}
#game-over-screen h1 { font-size: 42px; margin-bottom: 10px; color: #FF3344; letter-spacing: 4px; }
#game-over-screen p { font-size: 16px; color: #00FF66; margin-bottom: 25px; }
.restart-btn {
    background: rgba(0, 255, 102, 0.15); border: 1px solid #00FF66; color: #00FF66;
    padding: 12px 30px; font-weight: bold; cursor: pointer;
    font-family: inherit; font-size: 14px; letter-spacing: 2px;
    box-shadow: 0 0 15px rgba(0,255,102,0.3); transition: all 0.2s;
}
.restart-btn:hover { background: #00FF66; color: #000; }

.log-panel {
    position: absolute; bottom: 75px; left: 25px;
    pointer-events: none; font-size: 11px; color: #00FF66;
    opacity: 0.85; max-height: 90px; text-shadow: 0 0 4px #00FF66;
    z-index: 10;
}

/* --- LEVEL 0 (INFESTED ICE HELL) RED UI THEME OVERRIDES --- */
body[data-level="level0_test"] {
    color: #FF3344;
}
body[data-level="level0_test"] .hud-overlay {
    color: #FF3344;
    text-shadow: 0 0 8px rgba(255, 51, 68, 0.7);
}
body[data-level="level0_test"] .status-box {
    background: rgba(22, 6, 8, 0.92);
    border: 1px solid #FF3344;
    box-shadow: 0 0 15px rgba(255, 51, 68, 0.28);
    color: #FF3344;
}
body[data-level="level0_test"] .bar-outer {
    background: rgba(35, 0, 8, 0.9);
    border: 1px solid #FF3344;
}
body[data-level="level0_test"] .log-panel {
    color: #FF3344;
    text-shadow: 0 0 4px #FF3344;
}
body[data-level="level0_test"] #score-count {
    color: #FF6677 !important;
}
body[data-level="level0_test"] #game-over-screen {
    text-shadow: 0 0 10px #FF3344;
}
body[data-level="level0_test"] #game-over-screen p {
    color: #FF3344;
}
body[data-level="level0_test"] .restart-btn {
    background: rgba(255, 51, 68, 0.18);
    border: 1px solid #FF3344;
    color: #FF3344;
    box-shadow: 0 0 15px rgba(255, 51, 68, 0.35);
}
body[data-level="level0_test"] .restart-btn:hover {
    background: #FF3344;
    color: #000;
}

年被战术盲雾遮蔽，能见度降至极低。","一旦激光被触碰或安保警报拉响，驻防的防爆重装守卫将展开地毯式清场。"],objective:"突破激光探测网，坚守并肃清 4 波金库精锐守卫",targetWave:4,notice:"全区战术盲雾限制常态视野；激光网不可直接穿越，善用盲区延迟结算伤害，在黑暗中破敌。"},{id:"level4",code:"SECTOR 04 // VESSEL AEGIS",title:"第 4 关 · 豪华游艇",intel:["财团高管正于公海超级游艇上召开私人防务闭门峰会。","这艘重型游艇从船尾无边泳池延伸至船首直升机停机坪，驻扎了全副武装的私人雇佣兵卫队。","公海孤立无援，敌方增援艇已在外围海面形成包围圈。"],objective:"占领甲板与沙龙，坚守并肃清 4 波雇佣兵反扑",targetWave:4,notice:"泳池内部水阻极大且限制常规枪械开火；合理利用沙龙、客舱与停机坪的掩体层次展开拉扯。"},{id:"level5",code:"SECTOR 05 // GRAND HORIZON",title:"第 5 关 · 酒店大堂",intel:["财团总指挥部退守于涉外五星级豪华酒店大堂，将其改造为前线坚固据点。","雕花红木与大理石立柱之间暗藏杀机，敌军已在此正式部署高危作战单位——“暗幕干扰者 (Jammer)”。","干扰者释放的局部暗幕将使进入的特工视界受阻并行动迟缓，极大颠覆战场态势。"],objective:"瓦解大堂防务据点，坚守并肃清 4 波高危武装力量",targetWave:4,notice:"干扰者配备半弧形单向高能护盾，误入其暗幕极度危险；务必拉开距离优先狙杀干扰者。"},{id:"level6",code:"SECTOR 06 // IRONFANG EXPRESS",title:"第 6 关 · 装甲特快列车",intel:["财团核心人员登上了高速极地特快装甲列车，穿行于荒原极寒地带。","列车由客舱、餐车、VIP舱、控制室、引擎动力室与货仓 6 节车厢贯通相连，是极度狭长的致命走廊。","极寒与颠簸之中，全武装防暴突击队正沿着车厢走廊步步推进。"],objective:"在极速列车中推进，坚守并肃清 5 波特快突击队",targetWave:5,notice:"狭窄通道没有任何迂回空间，正面对决格外凶险；利用跨车厢掩体投掷手雷并合理利用连杀重武器。"},{id:"level7",code:"SECTOR 07 // APEX NEXUS",title:"第 7 关 · 顶石科研中心",intel:["深潜于地下百米的顶石科研中心是百眼防务最核心的战略神经中枢。","中央梯形主控大厅架设了全域神经链接核心，四联曲面终端与北向全景观察廊构筑严密防线。","特工“幽灵”已突入中枢大厅，必须坚守控制核心并瓦解精锐安保卫队。"],objective:"坚守梯形主控大厅，肃清 5 波顶石精锐防卫部队",targetWave:5,notice:"善用环形控制台与双联工作站作为掩体，利用移步换景全向机动拉扯敌人，掌控交火节奏。"}]},objectiveModal:{title:"关卡作战目标已达成！",subtitle:"敌方常规防线已被击溃，战略撤离通道已成功开辟。",waveCompletedDesc:e=>`已成功肃清前 ${e} 波守备力量，任务指标完全达成。`,extractBtn:"撤离并前往下一关",continueBtn:"继续坚守 / 刷波次",finalVictoryBtn:"彻底终结行动 · 战役大捷",campaignVictoryTitle:"全线大捷 · 全知网络彻底崩溃！",campaignVictoryDesc:"幽灵特工已成功穿透全部 7 大防御要塞，绝对观测之眼被永久摧毁，视界自由重归人类！",extractHudTip:"已达成目标 · 随时按 [E] 撤离",hudExtractBtn:"[E] 撤离至下一关",objectiveBadge:(e,u)=>`目标波次: ${e}/${u}`},tutorial:{title:"操作指南与游戏机制",backBtn:"返回",moveAimTitle:"移动与瞄准",moveAimDesc1:"W A S D：控制角色全向移动。",moveAimDesc2:"鼠标移动：瞄准与视角转向。",weaponsTitle:"武器系统",weaponsDesc1:"鼠标左键：开火射击。",weaponsDesc2:"1 - 5 键：切换主副武器。初始配备步枪，其他武器由击杀敌人掉落拾取。",armorTitle:"防弹衣与补给",armorDesc1:"防弹衣吸收子弹与爆炸伤害；脱战 ,"a clandestine multilateral defense agency","operating beyond sovereign boundaries."],p2:["By the mid-21st century,","rapid breakthroughs in automated tracking and electro-optical sensors arrived.","Confronting complex global threats,","governments surrendered defense autonomy to algorithms,","gradually outsourcing SIA’s vast global surveillance infrastructure","to private defense conglomerates."],p3:["Argus Defense Group rose to absolute dominance.","By deploying an omniscient automated sensor network—","“Argus Panoptes”—across sovereign borders and key strongholds,","Argus established complete surveillance over physical","and digital realms worldwide."],p4:["Under Argus Panoptes,","any unauthorized movement is immediately flagged and eliminated.","With private conglomerates controlling the global information choke-point,","sovereign defense lines were hollowed out from within.","A silent war for information hegemony began."],p5:["To break this one-way transparency,","the covert remnants of the SIA initiated their ultimate contingency—","engineering the experimental “Blind Zone Generator”,","a tactical device capable of halting localized photon and microwave transmission."],p6:["By manufacturing an unobservable information disconnect,","the prototype carves out a stable physical blind spot","entirely invisible to automated sensory lines."],p7:["As elite covert operative “Specter” from the Special Activities Division (SAD),","you are deployed deep behind enemy lines","equipped with the sole functioning prototype."],quote:["A silent war fought at the perimeter of perception.","One side enforces order through total transparency;","The other exploits observation lag to reshape reality in the dark."],skipTip:"[ Press any key or click anywhere to continue ]",enterBtn:"Start Game"},levelSelect:{title:"Level Selection",confirmBtn:"Enter Level",levels:[{id:"level0",title:"Level 00 · Infernal Abyss",badge:"LEVEL 00 · DEMON",desc:"Infernal Molten Abyss: Frozen Cocytus lake,
