<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>视界滞后 - Sight Lag</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    background-color: #020403; color: #00FF66;
    font-family: ui-monospace, "SF Mono", Monaco, Menlo, Consolas, "Cascadia Code", "Roboto Mono", "PingFang SC", "Microsoft YaHei", "Source Han Sans CN", monospace;
    overflow: hidden; user-select: none;
}
#game-container { position: relative; width: 100vw; height: 100vh; background: #030705; overflow: hidden; }
canvas { display: block; cursor: crosshair; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

.hud-overlay {
    position: absolute; top: 15px; left: 20px; right: 20px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; font-weight: bold; font-size: 11px;
    letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(0,255,102,0.6);
    z-index: 10;
}
.status-box {
    background: rgba(4, 16, 10, 0.90); border: 1px solid #00FF66;
    padding: 10px 16px; border-radius: 4px;
    box-shadow: 0 0 15px rgba(0,255,102,0.2); min-width: 250px;
}
.status-box.right-status {
    min-width: 150px;
    padding: 8px 14px;
    margin-top: 48px;
    margin-right: 0px;
}
.bar-outer {
    width: 100%; height: 10px; background: rgba(0, 30, 15, 0.9);
    border: 1px solid #00FF66; margin-top: 3px; position: relative;
    box-shadow: inset 0 0 5px #000;
}
.bar-inner { height: 100%; width: 100%; background: #00FF66; transition: width 0.05s linear; }
.bar-inner.blind { background: #FFCC00; }
.bar-inner.shield { background: #00CCFF; }

#alarm-banner {
    display: none; position: absolute; top: 85px; left: 50%; transform: translateX(-50%);
    color: #FF3344; font-size: 14px; font-weight: bold; letter-spacing: 2px;
    text-shadow: 0 0 10px #FF3344; animation: blink 0.8s infinite alternate;
    z-index: 10; pointer-events: none;
    background: rgba(20, 4, 6, 0.85); padding: 6px 16px; border: 1px solid #FF3344; border-radius: 4px;
    white-space: nowrap; max-width: 95vw; box-sizing: border-box; text-align: center;
}
@keyframes blink { from { opacity: 1; } to { opacity: 0.3; } }

#game-over-screen {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(2, 6, 4, 0.94); z-index: 100; flex-direction: column;
    justify-content: center; align-items: center; text-shadow: 0 0 10px #00FF66;
}
#game-over-screen h1 { font-size: 42px; margin-bottom: 10px; color: #FF3344; letter-spacing: 4px; }
#game-over-screen p { font-size: 16px; color: #00FF66; margin-bottom: 25px; }
.restart-btn {
    background: rgba(0, 255, 102, 0.15); border: 1px solid #00FF66; color: #00FF66;
    padding: 12px 30px; font-weight: bold; cursor: pointer;
    font-family: inherit; font-size: 14px; letter-spacing: 2px;
    box-shadow: 0 0 15px rgba(0,255,102,0.3); transition: all 0.2s;
}
.restart-btn:hover { background: #00FF66; color: #000; }

.log-panel {
    position: absolute; bottom: 75px; left: 25px;
    pointer-events: none; font-size: 11px; color: #00FF66;
    opacity: 0.85; max-height: 90px; text-shadow: 0 0 4px #00FF66;
    z-index: 10;
}

/* --- LEVEL 0 (INFESTED ICE HELL) RED UI THEME OVERRIDES --- */
body[data-level="level0_test"] {
    color: #FF3344;
}
body[data-level="level0_test"] .hud-overlay {
    color: #FF3344;
    text-shadow: 0 0 8px rgba(255, 51, 68, 0.7);
}
body[data-level="level0_test"] .status-box {
    background: rgba(22, 6, 8, 0.92);
    border: 1px solid #FF3344;
    box-shadow: 0 0 15px rgba(255, 51, 68, 0.28);
    color: #FF3344;
}
body[data-level="level0_test"] .bar-outer {
    background: rgba(35, 0, 8, 0.9);
    border: 1px solid #FF3344;
}
body[data-level="level0_test"] .log-panel {
    color: #FF3344;
    text-shadow: 0 0 4px #FF3344;
}
body[data-level="level0_test"] #score-count {
    color: #FF6677 !important;
}
body[data-level="level0_test"] #game-over-screen {
    text-shadow: 0 0 10px #FF3344;
}
body[data-level="level0_test"] #game-over-screen p {
    color: #FF3344;
}
body[data-level="level0_test"] .restart-btn {
    background: rgba(255, 51, 68, 0.18);
    border: 1px solid #FF3344;
    color: #FF3344;
    box-shadow: 0 0 15px rgba(255, 51, 68, 0.35);
}
body[data-level="level0_test"] .restart-btn:hover {
    background: #FF3344;
    color: #000;
}

第 1 关",desc:"机场航站楼：包含安检门警报、红外监控摄像、行李传送带与防暴盾牌敌人。"},{id:"level2",title:"第 2 关 · 地铁站台",badge:"第 2 关",desc:"地下铁站台：长廊型双层站台、进站闸机通道、列车车体与玻璃隔音墙掩体。"},{id:"level3",title:"第 3 关 · 银行金库",badge:"第 3 关",desc:"中央银行金库：配备高能红外激光探测网、重型钢制墙体与全区战术盲雾。"},{id:"level4",title:"第 4 关 · 豪华游艇",badge:"第 4 关",desc:"超级游艇：尾部游泳池、沙龙、餐厅、主卧套房、客房以及船首直升机停机坪。"},{id:"level5",title:"第 5 关 · 酒店大堂",badge:"第 5 关",desc:"五星级酒店大堂：闪灵风格雕花红木墙、行李寄存处、前台、大堂休息区与 VIP 奢华沙龙。"},{id:"level6",title:"第 6 关 · 装甲特快列车",badge:"第 6 关",desc:"现代特快装甲列车：狭长战术走廊，按序包含客舱、餐车、VIP舱室、控制室、引擎室与货仓 6 大真实车厢区域。"},{id:"level7",title:"第 7 关 · 顶石科研中心",badge:"第 7 关",desc:"顶石科研中心：正中央梯形战术指挥大厅、环形反应堆数据核心、四联曲面工作台与北向全景俯瞰廊。"},{id:"level8",title:"第 8 关 · 隔离测试关卡",badge:"第 8 关 · 测试",desc:"100% 隔离测试关卡：用于评估深色木制 45° 讲台、马蹄形 U 型工作台与重型装甲外墙，绝对不波及 Level 0 ~ 7。"}]},levelBriefing:{missionBriefingTitle:"战术前情提要 // 任务简报",sectorIntelTitle:"区域情报档案",primaryObjectiveTitle:"核心行动目标",tacticalNoticeTitle:"战术作战备忘",skipTip:"[ 按任意键或点击下方按钮直接部署进驻 ]",deployBtn:"开始行动 · 部署进驻",levels:[{id:"level0",code:"SECTOR 00 // INFERNAL ABYSS",title:"第 0 关 · 地狱熔岩深渊",intel:["这是位于现实维度边缘的不可测深渊，充斥着刺骨寒冰湖与炽烈熔岩河。","16 名残暴的地狱恶魔（Demon）已在深渊要塞部署，喷吐三连地狱火弹并具备近战烈焰撕裂。","在此关卡中已激活专属恶魔神秘武器库：重型三管猎枪、符文光镰、地狱熔岩阵与灵魂汲取。"],objective:"突入深渊要塞，肃清全部 16 名盘踞的地狱恶魔",targetWave:1,notice:"按数字键 1~4 自由切换 4 种恶魔专属武器；击败恶魔可吸取灵魂叠加血祭增益；小心避开熔岩与恶魔近身扑咬。"},{id:"level1",code:"SECTOR 01 // AIRPORT TERMINAL",title:"第 1 关 · 机场航站楼",intel:["财团正通过该国际航运枢纽，秘密转移第三代全域监控芯片试验品。","整座航站楼已被武装安保部队全盘接管，各出入口配备金属探测门与红外监控摄像头。","安检门与防暴盾牌兵构成了前哨警戒网，一旦触发警报将招致全区包夹。"],objective:"突入大厅，坚守并肃清 3 波警备武装力量",targetWave:3,notice:"穿越安检门时注意避开红外探头；利用盲区制造信息断层，逐个瓦解防暴盾牌掩护。"},{id:"level2",code:"SECTOR 02 // METRO PLATFORM",title:"第 2 关 · 地铁站台",intel:["地面机场受到打击后，敌军精锐封锁了地下双层轨道交通枢纽，企图彻底截断撤离路线。","双层站台长廊遍布进出站闸机与防弹玻璃隔断，敌方步兵正配合防暴防线在站台组织交叉火力。","列车车厢与地下廊柱成为天然的战术掩护，但也极易遭遇侧翼包抄。"],objective:"突破地下封锁，坚守并肃清 3 波搜剿部队",targetWave:3,notice:"防弹玻璃虽可通透视线但会大幅衰减子弹杀伤；利用矮墙掩体抛投破片手雷，并在盲区内瞬移包抄。"},{id:"level3",code:"SECTOR 03 // VAULT SIGMA",title:"第 3 关 · 银行金库",intel:["财团洗钱网络与深层密钥中枢隐藏在中央银行地下金库中。","内部安装有高能红外激光侦测网与重型密封钢门，且常年被战术盲雾遮蔽，能见度降至极低。","一旦激光被触碰或安保警报拉响，驻防的防爆重装守卫将展开地毯式清场。"],objective:"突破激光探测网，坚守并肃清 4 波金库精锐守卫",targetWave:4,notice:"全区战术盲雾限制常态视野；激光网不可直接穿越，善用盲区延迟结算伤害，在黑暗中破敌。"},{id:"level4",code:"SECTOR 04 // VESSEL AEGIS",title:"第 4 关 · 豪华游艇",intel:["财团高管正于公海超级游艇上召开私人防务闭门峰会。","这艘重型游艇从船尾无边泳池延伸至船首直升机停机坪，驻扎了全副武装的私人雇佣兵卫队。","公海孤立无援，敌方增援艇已在外围海面形成包围圈。"],objective:"占领甲板与沙龙，坚守并肃清 4 波雇佣兵反扑",targetWave:4,notice:"泳池内部水阻极大且限制常规枪械开火；合理利用沙龙、客舱与停机坪的掩体层次展开拉扯。"},{id:"level5",code:"SECTOR 05 // GRAND HORIZON",title:"第 5 关 · 酒店大堂",intel:["财团总指挥部退守于涉外五星级豪华酒店大堂，将其改造为前线坚固据点。","雕花红木与大理石立柱之间暗藏杀机，敌军已在此正式部署高危作战单位——“暗幕干扰者 (Jammer)”。","干扰者释放的局部暗幕将使进入的特工视界受阻并行动迟缓，极大颠覆战场态势。"],objective:"瓦解大堂防务据点，坚守并肃清 4 波高危武装力量",targetWave:4,notice:"干扰者配备半弧形单向高能护盾，误入其暗幕极度危险；务必拉开距离优先狙杀干扰者。"},{id:"level6",code:"SECTOR 06 // IRONFANG EXPRESS",title:"第 6 关 · 装甲特快列车",intel:["财团核心人员登上了高速极地特快装甲列车，穿行于荒原极寒地带。","列车由客舱、餐车、VIP舱、控制室、引擎动力室与货仓 6 节车厢贯通相连，是极度狭长的致命走廊。","极寒与颠簸之中，全武装防暴突击队正沿着车厢走廊步步推进。"],objective:"在极速列车中推进，坚守并肃清 5 波特快突击队",targetWave:5,notice:"狭窄通道没有任何迂回空间，正面对决格外凶险；利用跨车厢掩体投掷手雷并合理利用连杀重武器。"},{id:"level7",code:"SECTOR 07 // APEX NEXUS",title:"第 7 关 · 顶石科研中心",intel:["深潜于地下百米的顶石科研中心是百眼防务最核心的战略神经中枢。","中央梯形主控大厅架设了全域神经链接核心，四联曲面终端与北向全景观察廊构筑严密防线。","特工“幽灵”已突入中枢大厅，必须坚守控制核心并瓦解精锐安保卫队。"],objective:"坚守梯形主控大厅，肃清 5 波顶石精锐防卫部队",targetWave:5,notice:"善用环形控制台与双联工作站作为掩体，利用移步换景全向机动拉扯敌人，掌控交火节奏。"}]},objectiveModal:{title:"关卡作战目标已达成！",subtitle:"敌方常规防线已被击溃，战略撤离通道已成功开辟。",waveCompletedDesc:e=>`已成功肃清前 ${e} 波守备力量，任务指标完全达成。`,extractBtn:"撤离并前往下一关",continueBtn:"继续坚守 / 刷波次",finalVictoryBtn:"彻底终结行动 · 战役大捷",campaignVictoryTitle:"全线大捷 · 全知网络彻底崩溃！",campaignVictoryDesc:"幽灵特工已成功穿透全部 7 大防御要塞，绝对观测之眼被永久摧毁，视界自由重归人类！",extractHudTip:"已达成目标 · 随时按 [E] 撤离",hudExtractBtn:"[E] 撤离至下一关",objectiveBadge:(e,d)=>`目标波次: ${e}/${d}`},tutorial:{title:"操作指南与游戏机制",backBtn:"返回",moveAimTitle:"移动与瞄准",moveAimDesc1:"W A S D：控制角色全向移动。",moveAimDesc2:"鼠标移动：瞄准与视角转向。",weaponsTitle:"武器系统",weaponsDesc1:"鼠标左键：开火射击。",weaponsDesc2:"1 - 5 键：切换主副武器。初始配备步枪，其他武器由击杀敌人掉落拾取。V 键：切换步枪半自动/全自动（仅 Level 7/8）。",armorTitle:"防弹衣与补给",armorDesc1:"防弹衣吸收子弹与爆炸伤害；脱战后可缓慢自我恢复。",armorDesc2:"击败敌人掉落补给，拾取可恢复防弹衣与盲区能量。",blindTeleportTitle:"盲区与瞬移",blindTeleportDesc1:"按 Space 空格键开启/收起盲区。",blindTeleportDesc2:"在盲区内部双击鼠标左键可进行瞬移。",blindDamageTitle:"伤害延迟结算",blindDamageDesc:"盲区构筑双向视觉屏障（外部看不进，内部看不出）。在盲区内造成的伤害将在盲区解除瞬间一并爆发结算。",trapTitle:"诱饵陷阱 [5 + 右键]",trapDesc:"盲区开启且手持手雷（5 键）时，在盲区地面右键点击可部署诱饵陷阱。",killstreakTitle:"连杀奖励",killstreak3Title:"3 连杀：[ 6 键 ] 重机枪",killstreak3Desc:"高射速重型火力压制。",killstreak5Title:"5 连杀：[ 7 键 ] UAV 轰炸",killstreak5Desc:"扫描全图敌人并发动定点空袭。",killstreak7Title:"7 连杀：[ 8 键 / Space ] 全图盲区",killstreak7Desc:"全地图覆盖的绝对盲区隐匿。",observerTitle:"观察者敌人",observerDesc:"配备重装防弹衣，能看穿盲区，极易被诱饵陷阱吸引。",jammerTitle:"暗幕干扰者 (Jammer)",jammerDesc:"第 5 波起出现。释放局部盲区，使误入的玩家视野受限且行动迟缓，盲区内的敌人被攻击不显形；自身完全不受影响，并配备半弧形一次性高能护盾。",coverTitle:"特殊掩体",coverGlassDesc:"防弹玻璃：通透视线，子弹穿透但伤害衰减，拦截手雷投掷。",coverLowWallDesc:"矮墙：阻挡视线与直射子弹，支持手雷抛投越过。"},weapons:{rifle:"1: 步枪",pistol:"2: 手枪",smg:"3: 冲锋枪",sniper:"4: 狙击枪",grenade:"5: 手雷",machineGun:"6: 机枪",uav:"7: 空袭"}},en:{gameTitle:"OBSERVATION LAG",gameSubtitle:"",startMission:"Start Game",tacticalManual:"Tutorial",sectorSelect:"Level Select",languageSelect:"Language",tacticalPause:"Game Paused",resumeMission:"Resume",restartMission:"Restart",returnToMenu:"Main Menu",hudGuide:"Guide",hudSector:"Level",hudPause:"Pause",hudResume:"Resume",hudRestart:"Reset",hudMenu:"Menu",hudLang:"中文",hpLabel:"HP",armorLabel:"Armor",blindEnergyLabel:"Blind Zone [SPACE]",blindActiveLabel:"Blind Zone Active [SPACE]",waveLabel:"Wave",enemiesLabel:"Hostiles",nextWaveLabel:"Next wave incoming...",killsLabel:"Kills",alarmBanner:"🚨 ALARM TRIGGERED - HIGH ALERT 🚨",missionFailed:"Mission Failed",sectorCleared:"Level Cleared",agentFallenDesc:(e,d)=>`Operative eliminated on Wave ${e}. Total Kills: ${d}`,sectorClearedDesc:e=>`Area fully secured. Total Kills: ${e}`,restartBtn:"[ R ] Restart",prologue:{title:"Observation Lag",p1:["In the aftermath of World War II,","Western Allied nations signed a classified treaty in 1947","establishing the Strategic Intelligence Agency (SIA)—","a clandestine multilateral defense agency","operating beyond sovereign boundaries."],p2:["By the mid-21st century,","rapid breakthroughs in automated tracking and electro-optical sensors arrived.","Confronting complex global threats,","governments surrendered defense autonomy to algorithms,","gradually outsourcing SIA’s vast global surveillance infrastructure","to private defense conglomerates."],p3:["Argus Defense Group rose to absolute dominance.","By deploying an omniscient automated sensor network—","“Argus Panoptes”—across sovereign borders and key strongholds,","Argus established complete surveillance over physical","and digital realms worldwide."],p4:["Under Argus Panoptes,","any unauthorized movement is immediately flagged and eliminated.","With private conglomerates controlling the global information choke-point,","sovereign defense lines were hollowed out from within.","A silent war for information hegemony began."],p5:["To break this one-way transparency,","the covert remnants of the SIA initiated their ultimate contingency—","engineering the experimental “Blind Zone Generator”,","a tactical device capable of halting localized photon and microwave transmission."],p6:["By manufacturing an unobservable information disconnect,","the prototype carves out a stable physical blind spot","entirely invisible to automated sensory lines."],p7:["As elite covert operative “Specter” from the Special Activities Division (SAD),","you are deployed deep behind enemy lines","equipped with the sole functioning prototype."],quote:["A silent war fought at the perimeter of perception.","One side enforces order through total transparency;","The other exploits observation lag to reshape reality in the dark."],skipTip:"[ Press any key or click anywhere to continue ]",enterBtn:"Start Game"},levelSelect:{title:"Level Selection",confirmBtn:"Enter Level",levels:[{id:"level0",title:"Level 00 · Infernal Abyss",badge:"LEVEL 00 · DEMON",desc:"Infernal Molten Abyss: Frozen Cocytus lake, stalagmites, molten magma rivers, obsidian volcano, and hexagon sanctum with 16 demons."},{id:"level1",title:"Level 01 · Airport Terminal",badge:"LEVEL 01",desc:"Airport terminal featuring security metal detector gates, CCTV cameras, baggage conveyors, and riot shield units."},{id:"level2",title:"Level 02 · Subway Station",badge:"LEVEL 02",desc:"Multi-level metro platform with turnstile corridors, subway carriages, and bullet-resistant glass barriers."},{id:"level3",title:"Level 03 · Bank Vault",badge:"LEVEL 03",desc:"High-security bank vault with infrared laser tripwires, blast-proof doors, and tactical fog of war."},{id:"level4",title:"Level 04 · Luxury Yacht",badge:"LEVEL 04",desc:"Superyacht layout with stern swimming pool, VIP lounge, dining deck, master stateroom, guest suites, and bow helipad."},{id:"level5",title:"Level 05 · Hotel Lobby",badge:"LEVEL 05",desc:"Five-star hotel lobby with mahogany paneling, luggage storage, concierge desk, lounge, and VIP salon."},{id:"level6",title:"Level 06 · Armored Express Train",badge:"LEVEL 06",desc:"Modern Armored Express: Tactical train corridor featuring 6 realistic carriages: Passenger Coach, Dining & Bistro Car, VIP Luxury Suites, Control Bridge, Engine & Power Core, and Cargo Hold."},{id:"level7",title:"Level 07 · Apex Research Complex",badge:"LEVEL 07",desc:"Apex Research Complex: Central trapezoidal command chamber with circular reactor nexus, 4 curved quadrant consoles, and panoramic observation bay."},{id:"level8",title:"Level 08 · Isolated Test Sandbox",badge:"LEVEL 08",desc:"100% Standalone Test Environment: Used for evaluating the mahogany 45° speaker podium, horseshoe U-shaped workstation, and heavy armored outer walls."}]},levelBriefing:{missionBriefingTitle:"OPERATIONAL BRIEFING // INTEL DOSSIER",sectorIntelTitle:"SECTOR INTELLIGENCE",primaryObjectiveTitle:"PRIMARY OPERATIONAL OBJECTIVE",tacticalNoticeTitle:"TACTICAL RULES OF ENGAGEMENT",skipTip:"[ Press any key or click below to deploy ]",deployBtn:"COMMENCE OPERATION · DEPLOY",levels:[{id:"level0",code:"SECTOR 00 // INFERNAL ABYSS",title:"Level 00 · Infernal Abyss",intel:["An unmapped abyssal dimension at the edge of observable reality, fraught with frozen glacial lakes and rivers of searing magma.","16 aggressive infernal demons occupy the fortress, firing triple-hellfire volleys and executing deadly close-range fiery slashes.","Your arsenal in this realm is attuned to forbidden demonic armaments: Triple Shotgun, Rune Scythe, Lava Circle, and Soul Siphon."],objective:"Infiltrate the sanctum and eliminate all 16 abyssal demons",targetWave:1,notice:"Press keys 1-4 to switch demonic weapons; harvest demon souls to stack Blood Pact buffs; steer clear of open magma pits."},{id:"level1",code:"SECTOR 01 // AIRPORT TERMINAL",title:"Level 01 · Airport Terminal",intel:["The Syndicate is smuggling prototype 3rd-generation surveillance hardware through this international transit hub.","Terminal security is on full combat alert; armed guards, metal detection gates, and infrared CCTV coverage seal all wings.","Metal detector alarms and riot shield units form the vanguard. Breaching security will summon rapid reinforcements."],objective:"Infiltrate terminal and eliminate 3 waves of security forces",targetWave:3,notice:"Avoid lingering in CCTV cones; use Blind Zones to sever optical contact and flank riot shields."},{id:"level2",code:"SECTOR 02 // METRO PLATFORM",title:"Level 02 · Subway Station",intel:["Following the airport breach, Syndicate assault teams have cordoned off the underground dual-tier metro station.","Turnstile choke points, soundproof glass barriers, and subway carriages create dense overlapping fields of fire.","The subterranean acoustics carry gunfire swiftly; expect rapid infantry counter-attacks across platforms."],objective:"Secure underground terminal and eliminate 3 waves of assault units",targetWave:3,notice:"Bulletproof glass permits vision but attenuates bullet velocity; lo
